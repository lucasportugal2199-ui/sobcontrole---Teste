<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SobControle — Nova Transação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0B1120;
      --surface: #141C2E;
      --surface-elevated: #1A2540;
      --border: rgba(255,255,255,0.08);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --teal: #14B8A6;
      --emerald: #10B981;
      --rose: #F43F5E;
      --indigo: #6366F1;
      --amber: #F59E0B;
      --blue: #3B82F6;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .btn-close {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }
    .header-title { font-size: 1rem; font-weight: 700; }

    /* Type Switcher */
    .type-switcher {
      display: flex;
      background: var(--surface);
      margin: 16px 20px 0 20px;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .type-btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s;
    }
    .type-btn.active-despesa {
      background: rgba(244, 63, 94, 0.2);
      color: var(--rose);
      border: 1px solid rgba(244, 63, 94, 0.4);
    }
    .type-btn.active-receita {
      background: rgba(16, 185, 129, 0.2);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    /* Value Display Input */
    .value-display {
      padding: 24px 20px;
      text-align: center;
    }
    .value-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
    }
    .value-amount {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--rose);
      margin-top: 4px;
      letter-spacing: -1px;
    }

    /* Form Fields */
    .form-container {
      padding: 0 20px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .text-input, .select-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .text-input:focus, .select-input:focus {
      border-color: var(--teal);
    }

    /* OCR IA Scanner Card */
    .ocr-card {
      background: linear-gradient(135deg, rgba(20,184,166,0.1), rgba(99,102,241,0.1));
      border: 1px dashed var(--teal);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .ocr-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ocr-icon {
      font-size: 22px;
    }
    .ocr-text h4 { font-size: 0.82rem; font-weight: 700; color: #fff; }
    .ocr-text p { font-size: 0.7rem; color: var(--text-secondary); }

    /* Category Pill Selector */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .cat-btn.active {
      border-color: var(--rose);
      background: rgba(244,63,94,0.1);
      color: #fff;
    }
    .cat-btn span { font-size: 0.72rem; font-weight: 600; text-align: center; }

    /* Bottom Button */
    .btn-save {
      background: linear-gradient(135deg, var(--rose), #E11D48);
      border: none;
      color: #fff;
      padding: 16px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: auto;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.35);
    }
  </style>
</head>
<body>

  <header>
    <div class="btn-close">✕</div>
    <div class="header-title">Adicionar Transação</div>
    <div style="width: 36px;"></div>
  </header>

  <!-- Tipo de Transação -->
  <div class="type-switcher">
    <button class="type-btn active-despesa">Despesa</button>
    <button class="type-btn">Receita</button>
    <button class="type-btn">Transferência</button>
  </div>

  <!-- Valor -->
  <div class="value-display">
    <div class="value-label">Valor da despesa</div>
    <div class="value-amount">- R$ 149,90</div>
  </div>

  <div class="form-container">
    <!-- OCR Scanner -->
    <div class="ocr-card">
      <div class="ocr-left">
        <span class="ocr-icon">📷</span>
        <div class="ocr-text">
          <h4>Preencher com IA Scanner</h4>
          <p>Fotografe ou envie o comprovante/cupom</p>
        </div>
      </div>
      <span style="color: var(--teal); font-size: 18px;">✨</span>
    </div>

    <!-- Descrição -->
    <div class="input-group">
      <label class="input-label">Descrição</label>
      <input type="text" class="text-input" value="Jantar com Amigos" placeholder="Ex: Mercado, Almoço..." />
    </div>

    <!-- Categoria -->
    <div class="input-group">
      <label class="input-label">Categoria</label>
      <div class="category-grid">
        <div class="cat-btn active">
          <div style="font-size: 18px;">🍽️</div>
          <span>Alimentação</span>
        </div>
        <div class="cat-btn">
          <div style="font-size: 18px;">🚗</div>
          <span>Transporte</span>
        </div>
        <div class="cat-btn">
          <div style="font-size: 18px;">🛒</div>
          <span>Mercado</span>
        </div>
        <div class="cat-btn">
          <div style="font-size: 18px;">🎉</div>
          <span>Lazer</span>
        </div>
      </div>
    </div>

    <!-- Conta / Cartão & Pagamento -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div class="input-group">
        <label class="input-label">Forma de Pagamento</label>
        <select class="select-input">
          <option>Cartão de Crédito</option>
          <option>Débito / Pix</option>
          <option>Dinheiro em Espécie</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">Conta / Cartão</label>
        <select class="select-input">
          <option>Nubank Mastercard</option>
          <option>Itaú Visa Infinite</option>
          <option>Inter Conta Digital</option>
        </select>
      </div>
    </div>

    <!-- Data e Parcelas -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div class="input-group">
        <label class="input-label">Data</label>
        <input type="date" class="text-input" value="2026-08-15" />
      </div>

      <div class="input-group">
        <label class="input-label">Parcelamento</label>
        <select class="select-input">
          <option>À vista (1x)</option>
          <option>2x sem juros</option>
          <option>3x sem juros</option>
          <option>6x com juros</option>
          <option>12x com juros</option>
        </select>
      </div>
    </div>

    <!-- Salvar -->
    <button class="btn-save">Salvar Despesa</button>
  </div>

</body>
</html>
