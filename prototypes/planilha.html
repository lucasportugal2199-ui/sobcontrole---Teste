<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SobControle — Planilha Diária Redesign v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0B1120;
      --surface: #141C2E;
      --surface-elevated: #1A2540;
      --border: rgba(255,255,255,0.06);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --teal: #14B8A6;
      --teal-glow: rgba(20, 184, 166, 0.15);
      --emerald: #10B981;
      --rose: #F43F5E;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 20px;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      font-size: 18px;
    }

    .icon-btn:hover { background: var(--surface-elevated); }
    .icon-btn:active { transform: scale(0.92); }

    .header-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .today-btn {
      font-size: 14px;
      font-weight: 800;
      color: var(--teal);
      position: relative;
    }

    .today-btn::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--teal);
      border-radius: 50%;
    }

    /* ── Month Nav ── */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
    }

    .month-nav button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 44px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      font-size: 18px;
    }

    .month-nav button:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
    .month-nav button:active { transform: scale(0.9); }

    .month-label {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    /* ── Summary Card ── */
    .summary-card {
      margin: 0 20px;
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .summary-card.collapsed {
      padding: 14px 20px;
      gap: 0;
    }

    .summary-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .greeting-block { display: flex; flex-direction: column; gap: 2px; }

    .greeting-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .greeting-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .summary-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quick-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      transition: all 0.2s;
      color: white;
    }

    .quick-btn:active { transform: scale(0.88); }
    .quick-btn.income { background: var(--emerald); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .quick-btn.expense { background: var(--rose); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3); }

    .collapse-btn {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.3s;
      font-size: 14px;
    }

    .collapse-btn:hover { background: rgba(255,255,255,0.05); }
    .collapse-btn.rotated { transform: rotate(180deg); }

    .summary-balances {
      display: flex;
      gap: 24px;
      transition: all 0.3s;
    }

    .summary-card.collapsed .summary-collapsible {
      max-height: 0;
      opacity: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .summary-collapsible {
      max-height: 300px;
      opacity: 1;
      transition: all 0.3s ease;
    }

    .balance-block { display: flex; flex-direction: column; gap: 2px; }

    .balance-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .balance-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--emerald);
    }

    .balance-value.neutral { color: var(--text-primary); }

    .summary-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mini-metric {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
    }

    .mini-metric.income-bg {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.1);
    }

    .mini-metric.expense-bg {
      background: rgba(244, 63, 94, 0.06);
      border: 1px solid rgba(244, 63, 94, 0.1);
    }

    .mini-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .mini-icon.inc { background: rgba(16, 185, 129, 0.15); }
    .mini-icon.exp { background: rgba(244, 63, 94, 0.15); }

    .mini-detail { display: flex; flex-direction: column; }

    .mini-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .mini-value {
      font-size: 13px;
      font-weight: 800;
    }

    .summary-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-link {
      padding: 10px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .summary-link:hover { background: rgba(255,255,255,0.06); }
    .summary-link.primary { color: var(--teal); border-color: rgba(20, 184, 166, 0.15); }

    /* ── Spreadsheet Table ── */
    .spreadsheet-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px;
      padding-bottom: 120px;
    }

    .spreadsheet {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 3px;
    }

    .spreadsheet thead th {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 8px;
      text-align: right;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 5;
    }

    .spreadsheet thead th:first-child {
      text-align: center;
      width: 50px;
    }

    .spreadsheet tbody tr {
      cursor: pointer;
      transition: all 0.15s;
    }

    .spreadsheet tbody tr:hover td {
      background: rgba(255,255,255,0.03);
    }

    .spreadsheet tbody tr:active td {
      background: rgba(255,255,255,0.05);
    }

    .spreadsheet td {
      padding: 12px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: right;
      border-top: 1px solid transparent;
      border-bottom: 1px solid transparent;
      background: transparent;
      transition: background 0.15s;
    }

    .spreadsheet td:first-child {
      text-align: center;
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    }

    .spreadsheet td:last-child {
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    /* Day number cell */
    .day-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      transition: all 0.2s;
    }

    .day-num.today {
      background: var(--teal);
      color: white;
      box-shadow: 0 4px 12px rgba(20, 184, 166, 0.35);
    }

    .day-num.past {
      color: var(--text-secondary);
    }

    .day-num.future {
      color: var(--rose);
      opacity: 0.7;
    }

    .day-num.weekend {
      color: var(--text-muted);
      opacity: 0.5;
    }

    /* Today row highlight */
    .spreadsheet tr.today-row td {
      background: rgba(20, 184, 166, 0.04);
      border-top: 1px solid rgba(20, 184, 166, 0.15);
      border-bottom: 1px solid rgba(20, 184, 166, 0.15);
    }

    .spreadsheet tr.today-row td:first-child {
      border-left: 2px solid var(--teal);
    }

    /* Has data indicator */
    .spreadsheet tr.has-data td {
      color: var(--text-primary);
    }

    /* Values */
    .val-income { color: var(--emerald) !important; font-weight: 700; }
    .val-expense { color: var(--rose) !important; font-weight: 700; }
    .val-zero { color: var(--text-muted) !important; opacity: 0.4; }
    .val-saldo { color: var(--text-primary) !important; font-weight: 700; }
    .val-saldo-neg { color: var(--rose) !important; font-weight: 700; }

    .empty-dash {
      color: var(--text-muted);
      opacity: 0.2;
    }

    /* ── Detail Popup (when tapping a day) ── */
    .day-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .day-detail-overlay.open { display: flex; }

    .day-detail-panel {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 24px 20px 32px;
      max-height: 70vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .detail-handle {
      width: 36px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .detail-title {
      font-size: 16px;
      font-weight: 800;
    }

    .detail-close {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.05);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .detail-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .detail-stat {
      text-align: center;
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
    }

    .detail-stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .detail-stat-value {
      font-size: 15px;
      font-weight: 800;
    }

    .detail-tx-list { display: flex; flex-direction: column; gap: 0; }

    .detail-tx {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-tx:last-child { border-bottom: none; }

    .detail-tx-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .detail-tx-info {
      flex: 1;
      min-width: 0;
    }

    .detail-tx-desc {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-tx-cat {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .detail-tx-amount {
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .detail-empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }

    .detail-empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .detail-empty-text {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .detail-empty-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(20, 28, 46, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 6px 12px 20px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 100;
      border-radius: 28px 28px 0 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 4px;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-item.active { color: var(--teal); }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }

    .nav-center { display: flex; flex-direction: column; align-items: center; gap: 3px; }

    .nav-fab {
      width: 52px;
      height: 52px;
      background: var(--teal);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(20, 184, 166, 0.4);
      margin-top: -28px;
      transition: transform 0.2s;
    }

    .nav-fab:active { transform: scale(0.9); }
    .nav-fab svg { width: 24px; height: 24px; color: white; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in { animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-row">
      <button class="icon-btn" aria-label="Menu" onclick="window.location.href='menu.html'">☰</button>
      <span class="header-title">Planilha Diária</span>
      <button class="icon-btn today-btn" aria-label="Ir para hoje">26</button>
    </div>
    <nav class="month-nav">
      <button aria-label="Mês anterior">‹</button>
      <span class="month-label">Junho de 2026</span>
      <button aria-label="Próximo mês">›</button>
    </nav>
  </header>

  <!-- ── Summary Card (Collapsible) ── -->
  <div class="summary-card animate-in" id="summaryCard">
    <div class="summary-top-row">
      <div class="greeting-block">
        <span class="greeting-label">Bom dia,</span>
        <span class="greeting-name">Lucas! 👋</span>
      </div>
      <div class="summary-actions">
        <button class="quick-btn income" title="Nova receita">+</button>
        <button class="quick-btn expense" title="Nova despesa">−</button>
        <button class="collapse-btn" id="collapseBtn" aria-label="Recolher resumo" onclick="toggleCollapse()">▲</button>
      </div>
    </div>

    <div class="summary-collapsible" id="collapsible">
      <div class="summary-balances" style="margin-bottom: 12px;">
        <div class="balance-block">
          <span class="balance-label">Saldo em Contas</span>
          <span class="balance-value">R$ 12.450,00</span>
        </div>
        <div class="balance-block">
          <span class="balance-label">Previsão Fim do Mês</span>
          <span class="balance-value neutral" style="font-size: 16px; margin-top: 4px;">R$ 8.200,00</span>
        </div>
      </div>

      <div class="summary-metrics" style="margin-bottom: 12px;">
        <div class="mini-metric income-bg">
          <div class="mini-icon inc">↑</div>
          <div class="mini-detail">
            <span class="mini-label">Recebido</span>
            <span class="mini-value" style="color: var(--emerald)">R$ 8.200</span>
          </div>
        </div>
        <div class="mini-metric expense-bg">
          <div class="mini-icon exp">↓</div>
          <div class="mini-detail">
            <span class="mini-label">Gasto</span>
            <span class="mini-value" style="color: var(--rose)">R$ 5.750</span>
          </div>
        </div>
      </div>

      <div class="summary-action-row">
        <button class="summary-link primary">📊 Relatório Anual</button>
        <button class="summary-link">💳 Ver Faturas</button>
      </div>
    </div>
  </div>

  <!-- ── Spreadsheet Table ── -->
  <div class="spreadsheet-container animate-in delay-1">
    <table class="spreadsheet">
      <thead>
        <tr>
          <th>Dia</th>
          <th>Entradas</th>
          <th>Saídas</th>
          <th>Saldo</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Rows will be generated by JS -->
      </tbody>
    </table>
  </div>

  <!-- ── Day Detail Popup ── -->
  <div class="day-detail-overlay" id="dayDetail" onclick="closeDayDetail(event)">
    <div class="day-detail-panel" onclick="event.stopPropagation()">
      <div class="detail-handle"></div>
      <div class="detail-header">
        <span class="detail-title" id="detailTitle">Dia 26 — Quinta</span>
        <button class="detail-close" onclick="closeDayDetail()" aria-label="Fechar">✕</button>
      </div>
      <div class="detail-summary" id="detailSummary">
        <div class="detail-stat">
          <div class="detail-stat-label">Entradas</div>
          <div class="detail-stat-value val-income" id="detailIn">R$ 5.200</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat-label">Saídas</div>
          <div class="detail-stat-value val-expense" id="detailOut">R$ 287</div>
        </div>
        <div class="detail-stat">
          <div class="detail-stat-label">Saldo</div>
          <div class="detail-stat-value val-saldo" id="detailSaldo">R$ 12.450</div>
        </div>
      </div>
      <div class="detail-tx-list" id="detailTxList">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <!-- ── Bottom Nav ── -->
  <nav class="bottom-nav">
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span class="nav-label">Metas</span>
    </button>
    <button class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/></svg>
      <span class="nav-label">Movimentar</span>
    </button>
    <div class="nav-center">
      <button class="nav-fab" aria-label="Novo lançamento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <span class="nav-label" style="color: var(--text-muted);">Novo</span>
    </div>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="nav-label">Finanças</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="nav-label">Futuro</span>
    </button>
  </nav>

  <script>
    // ── Data ──
    const today = 26;
    const daysInMonth = 30;
    const weekdays = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    
    // Sample data - some days have transactions, most don't
    const dayData = {
      1: { income: 0, expense: 120, saldo: 7320, txs: [
        { desc: 'Netflix', cat: 'Lazer', icon: '🎬', color: 'rgba(75,192,192,0.1)', amount: -55.90 },
        { desc: 'Spotify', cat: 'Lazer', icon: '🎵', color: 'rgba(75,192,192,0.1)', amount: -21.90 },
        { desc: 'iFood', cat: 'Alimentação', icon: '🍕', color: 'rgba(255,159,64,0.1)', amount: -42.20 },
      ]},
      5: { income: 5200, expense: 0, saldo: 12520, txs: [
        { desc: 'Salário', cat: 'Salário', icon: '💰', color: 'rgba(16,185,129,0.1)', amount: 5200 },
      ]},
      8: { income: 0, expense: 1500, saldo: 11020, txs: [
        { desc: 'Aluguel', cat: 'Moradia', icon: '🏠', color: 'rgba(255,99,132,0.1)', amount: -1500 },
      ]},
      12: { income: 0, expense: 287.5, saldo: 10732.5, txs: [
        { desc: 'Supermercado Extra', cat: 'Alimentação', icon: '🛒', color: 'rgba(255,159,64,0.1)', amount: -287.50 },
      ]},
      15: { income: 3000, expense: 89.9, saldo: 13642.6, txs: [
        { desc: 'Freelance Design', cat: 'Vendas', icon: '📈', color: 'rgba(16,185,129,0.1)', amount: 3000 },
        { desc: 'Farmácia', cat: 'Saúde', icon: '💊', color: 'rgba(153,102,255,0.1)', amount: -89.90 },
      ]},
      20: { income: 0, expense: 156.8, saldo: 13485.8, txs: [
        { desc: 'Uber — Trabalho', cat: 'Transporte', icon: '🚗', color: 'rgba(54,162,235,0.1)', amount: -32.90 },
        { desc: 'Starbucks', cat: 'Alimentação', icon: '☕', color: 'rgba(255,159,64,0.1)', amount: -24.90 },
        { desc: 'Amazon Prime', cat: 'Lazer', icon: '📦', color: 'rgba(75,192,192,0.1)', amount: -14.90 },
        { desc: 'Gasolina Shell', cat: 'Transporte', icon: '⛽', color: 'rgba(54,162,235,0.1)', amount: -84.10 },
      ]},
      24: { income: 0, expense: 555.9, saldo: 12929.9, txs: [
        { desc: 'Energia Elétrica', cat: 'Moradia', icon: '⚡', color: 'rgba(255,99,132,0.1)', amount: -189.50 },
        { desc: 'Restaurante Outback', cat: 'Alimentação', icon: '🍽️', color: 'rgba(255,159,64,0.1)', amount: -310.50 },
        { desc: 'Netflix', cat: 'Lazer', icon: '🎬', color: 'rgba(75,192,192,0.1)', amount: -55.90 },
      ]},
      26: { income: 5200, expense: 287.5, saldo: 12450, txs: [
        { desc: 'Salário', cat: 'Salário', icon: '💰', color: 'rgba(16,185,129,0.1)', amount: 5200 },
        { desc: 'Supermercado Extra', cat: 'Alimentação', icon: '🛒', color: 'rgba(255,159,64,0.1)', amount: -287.50 },
      ]},
    };

    // Running saldo for days without explicit data
    let lastSaldo = 7200;

    // ── Render Table ──
    const tbody = document.getElementById('tableBody');

    for (let day = 1; day <= daysInMonth; day++) {
      const data = dayData[day];
      const isToday = day === today;
      const isPast = day < today;
      const isFuture = day > today;
      const hasData = !!data;
      
      // Calculate day of week (June 2026 starts on Monday)
      const date = new Date(2026, 5, day);
      const dow = date.getDay();
      const isWeekend = dow === 0 || dow === 6;
      
      if (hasData) lastSaldo = data.saldo;

      const tr = document.createElement('tr');
      if (isToday) tr.className = 'today-row';
      if (hasData) tr.classList.add('has-data');
      tr.onclick = () => openDayDetail(day);

      // Day cell
      let dayClass = 'past';
      if (isToday) dayClass = 'today';
      else if (isFuture) dayClass = isWeekend ? 'weekend' : 'future';

      const incomeStr = hasData && data.income > 0 
        ? `<span class="val-income">${fmt(data.income)}</span>` 
        : `<span class="empty-dash">—</span>`;
      
      const expenseStr = hasData && data.expense > 0 
        ? `<span class="val-expense">${fmt(data.expense)}</span>` 
        : `<span class="empty-dash">—</span>`;
      
      const saldo = hasData ? data.saldo : (isPast || isToday ? lastSaldo : 0);
      const saldoClass = !hasData && isFuture ? 'val-zero' : (saldo < 0 ? 'val-saldo-neg' : 'val-saldo');
      const saldoStr = isFuture && !hasData 
        ? `<span class="val-zero">R$ 0,00</span>` 
        : `<span class="${saldoClass}">${fmt(saldo)}</span>`;

      tr.innerHTML = `
        <td><span class="day-num ${dayClass}">${day}</span></td>
        <td>${incomeStr}</td>
        <td>${expenseStr}</td>
        <td>${saldoStr}</td>
      `;

      tbody.appendChild(tr);
    }

    function fmt(n) {
      return 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ── Collapse ──
    function toggleCollapse() {
      const card = document.getElementById('summaryCard');
      const btn = document.getElementById('collapseBtn');
      card.classList.toggle('collapsed');
      btn.classList.toggle('rotated');
    }

    // ── Day Detail ──
    function openDayDetail(day) {
      const overlay = document.getElementById('dayDetail');
      const data = dayData[day];
      const date = new Date(2026, 5, day);
      const dayName = weekdays[date.getDay()];

      document.getElementById('detailTitle').textContent = `Dia ${day} — ${dayName}`;

      if (!data || data.txs.length === 0) {
        document.getElementById('detailSummary').style.display = 'none';
        document.getElementById('detailTxList').innerHTML = `
          <div class="detail-empty">
            <div class="detail-empty-icon">📋</div>
            <div class="detail-empty-text">Nenhuma movimentação</div>
            <div class="detail-empty-sub">Toque no + para adicionar</div>
          </div>
        `;
      } else {
        document.getElementById('detailSummary').style.display = 'grid';
        document.getElementById('detailIn').textContent = fmt(data.income);
        document.getElementById('detailOut').textContent = fmt(data.expense);
        document.getElementById('detailSaldo').textContent = fmt(data.saldo);

        document.getElementById('detailTxList').innerHTML = data.txs.map(tx => `
          <div class="detail-tx">
            <div class="detail-tx-icon" style="background: ${tx.color}">${tx.icon}</div>
            <div class="detail-tx-info">
              <div class="detail-tx-desc">${tx.desc}</div>
              <div class="detail-tx-cat">${tx.cat}</div>
            </div>
            <div class="detail-tx-amount ${tx.amount >= 0 ? 'val-income' : 'val-expense'}">
              ${tx.amount >= 0 ? '+' : '-'}${fmt(Math.abs(tx.amount))}
            </div>
          </div>
        `).join('');
      }

      overlay.classList.add('open');
    }

    function closeDayDetail(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('dayDetail').classList.remove('open');
    }

    // Scroll to today after render
    setTimeout(() => {
      const todayRow = document.querySelector('.today-row');
      if (todayRow) {
        todayRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 300);
  </script>

</body>
</html>
