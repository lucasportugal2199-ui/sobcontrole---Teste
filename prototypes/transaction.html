<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SobControle — Nova Transação Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0B1120;
      --surface: #141C2E;
      --surface-elevated: #1A2540;
      --border: rgba(255,255,255,0.06);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --teal: #14B8A6;
      --emerald: #10B981;
      --rose: #F43F5E;
      --purple: #9333EA;
      --blue: #3B82F6;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 16px 20px;
      background: rgba(11, 17, 32, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--rose);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
      font-size: 20px;
    }

    .back-btn:hover { background: rgba(255,255,255,0.05); }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-spacer { width: 40px; }

    /* ── Tabs ── */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--surface);
      padding: 4px;
      border-radius: var(--radius-sm);
    }

    .tab {
      padding: 10px 4px;
      border: none;
      background: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      color: var(--text-muted);
    }

    .tab.active-despesa {
      background: var(--rose);
      color: white;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    .tab.active-receita {
      background: var(--emerald);
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .tab.active-transf {
      background: var(--blue);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .tab.active-cartao {
      background: var(--purple);
      color: white;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
    }

    .tab:not([class*="active"]):hover { color: var(--text-secondary); }

    /* ── Main ── */
    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Scanner Button ── */
    .scanner-btn {
      width: 100%;
      padding: 14px;
      background: var(--surface);
      border: 2px dashed rgba(20, 184, 166, 0.25);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--teal);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
    }

    .scanner-btn:hover {
      background: rgba(20, 184, 166, 0.05);
      border-color: rgba(20, 184, 166, 0.4);
    }

    /* ── Value Hero ── */
    .value-hero {
      text-align: center;
      padding: 24px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      position: relative;
    }

    .value-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--rose);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .value-input-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .value-input {
      font-family: inherit;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      background: none;
      border: none;
      outline: none;
      text-align: center;
      width: 100%;
      padding: 0 48px;
    }

    .value-input::placeholder { color: var(--text-muted); }

    .calc-btn {
      position: absolute;
      right: 4px;
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 20px;
      transition: all 0.2s;
    }

    .calc-btn:hover { color: var(--teal); background: rgba(255,255,255,0.05); }

    /* ── Form Fields ── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--rose);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-left: 4px;
    }

    .field-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .field-input:focus { border-color: rgba(20, 184, 166, 0.4); }
    .field-input::placeholder { color: var(--text-muted); }

    .field-selector {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .field-selector:hover { border-color: rgba(255,255,255,0.12); }

    .selector-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .selector-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .selector-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .selector-chevron {
      color: var(--text-muted);
      font-size: 16px;
    }

    /* ── Description with AI ── */
    .desc-wrapper {
      position: relative;
    }

    .desc-input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .desc-input:focus { border-color: rgba(20, 184, 166, 0.4); }
    .desc-input::placeholder { color: var(--text-muted); }

    .ai-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      color: var(--teal);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 18px;
      transition: all 0.2s;
      opacity: 0.7;
    }

    .ai-btn:hover { opacity: 1; background: rgba(20, 184, 166, 0.1); }

    /* ── Advanced Toggle ── */
    .advanced-toggle {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .advanced-toggle:hover { border-color: rgba(255,255,255,0.1); }

    .advanced-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      display: none;
    }

    .advanced-panel.open { display: flex; }

    .mode-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mode-btn {
      padding: 10px;
      border: 1px solid var(--border);
      background: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--teal);
      color: white;
      border-color: var(--teal);
      box-shadow: 0 4px 12px rgba(20, 184, 166, 0.25);
    }

    /* ── Submit ── */
    .submit-btn {
      width: 100%;
      padding: 18px;
      background: var(--rose);
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 8px;
    }

    .submit-btn:hover { background: #E11D48; }
    .submit-btn:active { transform: scale(0.98); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .delay-1 { animation-delay: 0.05s; }
    .delay-2 { animation-delay: 0.1s; }
    .delay-3 { animation-delay: 0.15s; }
    .delay-4 { animation-delay: 0.2s; }
    .delay-5 { animation-delay: 0.25s; }
    .delay-6 { animation-delay: 0.3s; }
    .delay-7 { animation-delay: 0.35s; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-row">
      <button class="back-btn" aria-label="Voltar">←</button>
      <span class="header-title">Nova Despesa</span>
      <div class="header-spacer"></div>
    </div>
    <div class="tabs">
      <button class="tab active-despesa">Despesa</button>
      <button class="tab">Receita</button>
      <button class="tab">Transf.</button>
      <button class="tab">Cartão</button>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Scanner -->
    <button class="scanner-btn animate-in">
      📷 Escanear Recibo
    </button>

    <!-- Value Hero -->
    <div class="value-hero animate-in delay-1">
      <div class="value-label">Valor</div>
      <div class="value-input-container">
        <input type="text" class="value-input" placeholder="R$ 0,00" inputmode="decimal" />
        <button class="calc-btn" aria-label="Calculadora" title="Calculadora">🧮</button>
      </div>
    </div>

    <!-- Date -->
    <div class="field-group animate-in delay-2">
      <label class="field-label">Quando?</label>
      <button class="field-selector">
        <div class="selector-left">
          <div class="selector-icon" style="background: rgba(20, 184, 166, 0.1); color: var(--teal);">📅</div>
          <span class="selector-text">26/06/2026</span>
        </div>
        <span class="selector-chevron">›</span>
      </button>
    </div>

    <!-- Account -->
    <div class="field-group animate-in delay-3">
      <label class="field-label">Qual Banco / Conta?</label>
      <button class="field-selector">
        <div class="selector-left">
          <div class="selector-icon" style="background: #7C3AED; border-radius: 50%; color: white; font-size: 12px; font-weight: 800;">Nu</div>
          <span class="selector-text">Nubank</span>
        </div>
        <span class="selector-chevron">›</span>
      </button>
    </div>

    <!-- Description -->
    <div class="field-group animate-in delay-4">
      <label class="field-label">Descrição</label>
      <div class="desc-wrapper">
        <input type="text" class="desc-input" placeholder="Ex: Aluguel, Mercado..." maxlength="30" />
        <button class="ai-btn" aria-label="Categorizar com IA" title="Categorizar com IA">✨</button>
      </div>
    </div>

    <!-- Category -->
    <div class="field-group animate-in delay-5">
      <label class="field-label">Categoria</label>
      <button class="field-selector">
        <div class="selector-left">
          <div class="selector-icon" style="background: rgba(255, 159, 64, 0.15); color: #FF9F40;">🛒</div>
          <span class="selector-text">Alimentação</span>
        </div>
        <span class="selector-chevron">›</span>
      </button>
    </div>

    <!-- Advanced Options -->
    <button class="advanced-toggle animate-in delay-6" onclick="document.querySelector('.advanced-panel').classList.toggle('open'); this.querySelector('.toggle-chevron').classList.toggle('rotated')">
      <span>Opções Avançadas</span>
      <span class="toggle-chevron" style="transition: transform 0.2s;">▾</span>
    </button>

    <div class="advanced-panel animate-in delay-6">
      <label class="field-label" style="color: var(--teal);">Tipo de Lançamento</label>
      <div class="mode-selector">
        <button class="mode-btn active">Único</button>
        <button class="mode-btn">Parcelado</button>
        <button class="mode-btn">Fixo</button>
      </div>
    </div>

    <!-- Submit -->
    <button class="submit-btn animate-in delay-7">Registrar Despesa</button>

  </main>

  <script>
    // Toggle advanced panel
    document.querySelector('.advanced-toggle').addEventListener('click', function() {
      const panel = document.querySelector('.advanced-panel');
      panel.classList.toggle('open');
      const chevron = this.querySelector('.toggle-chevron');
      chevron.style.transform = panel.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0)';
    });

    // Tab switching demo
    const tabs = document.querySelectorAll('.tab');
    const config = {
      0: { cls: 'active-despesa', title: 'Nova Despesa', color: '#F43F5E', label: 'Registrar Despesa', border: 'var(--rose)' },
      1: { cls: 'active-receita', title: 'Nova Receita', color: '#10B981', label: 'Registrar Receita', border: 'var(--emerald)' },
      2: { cls: 'active-transf', title: 'Transferência', color: '#3B82F6', label: 'Transferir', border: 'var(--blue)' },
      3: { cls: 'active-cartao', title: 'Cartão de Crédito', color: '#9333EA', label: 'Lançar no Cartão', border: 'var(--purple)' },
    };

    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => { t.className = 'tab'; });
        tab.classList.add(config[i].cls);
        document.querySelector('.header-title').textContent = config[i].title;
        document.querySelector('.submit-btn').textContent = config[i].label;
        document.querySelector('.submit-btn').style.background = config[i].color;
        document.querySelector('.submit-btn').style.boxShadow = `0 8px 24px ${config[i].color}4D`;
        document.querySelector('.header').style.borderBottomColor = config[i].color;
        document.querySelectorAll('.field-label').forEach(l => l.style.color = config[i].color);
        document.querySelector('.value-label').style.color = config[i].color;
      });
    });
  </script>

</body>
</html>
