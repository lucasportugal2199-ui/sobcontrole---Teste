<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SobControle — Login Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0B1120;
      --surface: #141C2E;
      --border: rgba(255,255,255,0.06);
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --teal: #14B8A6;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Background Effects ── */
    .bg-glow {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.08) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: fixed;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.05) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Particles */
    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(20, 184, 166, 0.3);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20px) rotate(720deg); opacity: 0; }
    }

    /* ── Content ── */
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 340px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    /* ── Logo ── */
    .logo-container {
      margin-bottom: 20px;
    }

    .logo {
      width: 96px;
      height: 96px;
      background: linear-gradient(135deg, var(--teal), #0D9488);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 800;
      color: white;
      box-shadow: 0 20px 60px rgba(20, 184, 166, 0.25);
      position: relative;
    }

    .logo::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(20, 184, 166, 0.4), transparent);
      z-index: -1;
    }

    /* ── Title ── */
    .app-name {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .app-tagline {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* ── Feature Pills ── */
    .features {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 48px;
    }

    .feature-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .feature-check {
      color: var(--teal);
      font-size: 14px;
    }

    /* ── Terms ── */
    .terms-container {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .terms-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    .terms-checkbox:checked {
      background: var(--teal);
      border-color: var(--teal);
    }

    .terms-checkbox:checked::after {
      content: '✓';
      color: white;
      font-size: 13px;
      font-weight: 800;
    }

    .terms-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.5;
      text-align: left;
    }

    .terms-link {
      color: var(--text-primary);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }

    .terms-link:hover { color: var(--teal); }

    /* ── Google Button ── */
    .google-btn {
      width: 100%;
      padding: 16px 20px;
      background: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #1F2937;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 40px rgba(255, 255, 255, 0.15);
    }

    .google-btn:active { transform: scale(0.98); }

    .google-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .google-logo {
      width: 22px;
      height: 22px;
    }

    /* ── Version ── */
    .version {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 24px;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-scale { animation: scaleIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .animate-in { animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .delay-1 { animation-delay: 0.15s; }
    .delay-2 { animation-delay: 0.3s; }
    .delay-3 { animation-delay: 0.45s; }
    .delay-4 { animation-delay: 0.6s; }
    .delay-5 { animation-delay: 0.75s; }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>
  <div class="particles" id="particles"></div>

  <!-- Content -->
  <div class="content">

    <!-- Logo -->
    <div class="logo-container animate-scale">
      <div class="logo">S</div>
    </div>

    <!-- Title -->
    <h1 class="app-name animate-in delay-1">SobControle</h1>
    <p class="app-tagline animate-in delay-2">Sua vida financeira, sob controle.</p>

    <!-- Feature Pills -->
    <div class="features animate-in delay-3">
      <div class="feature-pill">
        <span class="feature-check">✓</span>
        Controle total
      </div>
      <div class="feature-pill">
        <span class="feature-check">✓</span>
        IA integrada
      </div>
      <div class="feature-pill">
        <span class="feature-check">✓</span>
        100% gratuito
      </div>
    </div>

    <!-- Terms -->
    <div class="terms-container animate-in delay-4">
      <input type="checkbox" class="terms-checkbox" id="terms" onchange="document.getElementById('loginBtn').disabled = !this.checked" />
      <label for="terms" class="terms-text">
        Eu li e concordo com os <a href="#" class="terms-link">Termos de Uso</a> e a <a href="#" class="terms-link">Política de Privacidade</a>.
      </label>
    </div>

    <!-- Google Button -->
    <button class="google-btn animate-in delay-4" id="loginBtn" disabled>
      <svg class="google-logo" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Entrar com Google
    </button>

    <span class="version animate-in delay-5">v2.0 — SobControle Finanças</span>
  </div>

  <script>
    // Generate floating particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.width = (Math.random() * 3 + 1) + 'px';
      p.style.height = p.style.width;
      p.style.animationDuration = (Math.random() * 15 + 10) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.opacity = Math.random() * 0.5 + 0.1;
      container.appendChild(p);
    }
  </script>

</body>
</html>
