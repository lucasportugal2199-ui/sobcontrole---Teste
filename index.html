            'fin-expense': '#EF4444',
            'fin-info': '#EA580C',
            'fin-warning': '#F59E0B',
            'fin-invest': '#8B5CF6',
            'fin-action': '#EA580C',
          }

  <script type="importmap">
{

  <style>
    :root {
      --sat: env(safe-area-inset-top, 24px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 16px);
      --sal: env(safe-area-inset-left, 0px);
    }

    *,
    *::before,
    *::after,
    html,
    body,
    #root,
    input,
    button,
    select,
    textarea,
    h1, h2, h3, h4, h5, h6,
    p, span, a, label {
      font-family: 'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    /* Numerais Tabulares para alinhamento fintech perfeito */
    .tabular-nums,
    [data-tabular-nums] {
      font-variant-numeric: tabular-nums !important;
      -webkit-font-feature-settings: "tnum" 1 !important;
      font-feature-settings: "tnum" 1 !important;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      user-select: none;
      background-color: #F1F5F9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .dark html,
    .dark body,
    .dark #root {
      background-color: #050505;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Glassmorphism & Effects — OLED */
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dark .glass {
      background: rgba(17, 17, 17, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .glass-header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .dark .glass-header {
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Estilos para inputs focados não puxarem barras de sistema */
    input,
    textarea {
      scroll-margin-bottom: 25vh;
    }

    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* Removido o padding sat/sab automático do container root para permitir modo imersivo total */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes slideInFromLeft {
      from {
        opacity: 0.5;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInFromRight {
      from {
        opacity: 0.5;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .month-slide-enter-left {
      animation: slideInFromLeft 0.4s ease-out forwards;
    }

    .month-slide-enter-right {
      animation: slideInFromRight 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    @keyframes subtleFadeIn {
      from {
        opacity: 0.3;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .subtle-fade-in {
      animation: subtleFadeIn 0.4s ease-out forwards;
    }

    @keyframes pulse {
      50% {
        opacity: .5;
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
      20%, 40%, 60%, 80% { transform: translateX(6px); }
    }

    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    .skeleton-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .swiping,
    .swiping body {
      overflow-y: hidden;
      -webkit-overflow-scrolling: none;
    }

    /* Remover outline/borda dos gráficos Recharts ao clicar/tocar */
    .recharts-wrapper,
    .recharts-wrapper *,
    .recharts-surface,
    .recharts-sector,
    .recharts-layer,
    .recharts-tooltip-wrapper,
    .recharts-active-shape,
    .recharts-pie,
    .recharts-pie-sector {
      outline: none !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    .recharts-wrapper:focus,
    .recharts-wrapper:focus-visible,
    .recharts-surface:focus,
    .recharts-surface:focus-visible {
      outline: none !important;
      box-shadow: none !important;
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stagger-card {
      animation: cardSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Neon Glow Effects */
    .neon-glow-lime {
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.15), 0 0 60px rgba(204, 255, 0, 0.05);
    }

    .neon-glow-red {
      box-shadow: 0 0 20px rgba(255, 59, 92, 0.15), 0 0 60px rgba(255, 59, 92, 0.05);
    }

    /* Bento card hover effect */
    .bento-card {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
    }

    .bento-card:active {
      transform: scale(0.97);
    }

    /* Floating nav glassmorphism */
    .floating-nav {
      background: rgba(17, 17, 17, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .light .floating-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* Goal Calculator Slider */
    .goal-slider {
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }

    .goal-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
      border: 3px solid white;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .goal-slider::-webkit-slider-thumb:active {
      transform: scale(1.15);
      box-shadow: 0 2px 12px rgba(99, 102, 241, 0.6);
    }

    .goal-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
      border: 3px solid white;
    }
  </style>

</head>
